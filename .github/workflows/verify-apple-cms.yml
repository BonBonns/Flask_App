name: verify-apple-cms

on:
  push:
    paths:
      - .github/workflows/verify-apple-cms.yml
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Identify shipping Security build
        shell: bash
        run: |
          set -euxo pipefail
          sw_vers
          strings /usr/bin/security | grep 'PROGRAM:security' || true
          otool -L /usr/bin/security | grep Security.framework || true
          shasum -a 256 /usr/bin/security

      - name: Thin x86_64 slice and dump disassembly
        shell: bash
        run: |
          set -euxo pipefail
          lipo /usr/bin/security -thin x86_64 -output "$RUNNER_TEMP/security.x86_64"
          xcrun llvm-objdump --macho --disassemble --no-show-raw-insn "$RUNNER_TEMP/security.x86_64" > "$RUNNER_TEMP/security.dis"
          xcrun llvm-objdump --macho --syms "$RUNNER_TEMP/security.x86_64" > "$RUNNER_TEMP/security.syms" || true
          wc -l "$RUNNER_TEMP/security.dis"

      - name: Locate recipient parser landmarks
        shell: bash
        run: |
          set +e
          DIS="$RUNNER_TEMP/security.dis"
          echo '=== calls to strchr / strdup / getopt ==='
          grep -n -E '_strchr|_strdup|_getopt' "$DIS" | head -200 || true
          echo '=== comparisons involving 0x80 / 128 ==='
          grep -n -Ei 'cmp.*(0x80|\$128|\$0x80)|cmpl.*(0x80|128)|cmpq.*(0x80|128)' "$DIS" | head -200 || true
          echo '=== known CMS error/call landmarks ==='
          grep -n -E 'SecSMIMEFindBulkAlgForRecipients|SecCmsRecipientInfoCreate|SecCmsEnvelopedDataAddRecipient' "$DIS" | head -100 || true

      - name: Print focused windows around strchr and strdup calls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path(__import__('os').environ['RUNNER_TEMP'])/'security.dis'
          lines = p.read_text(errors='replace').splitlines()
          hits=[]
          for i,line in enumerate(lines):
              if '_strchr' in line or '_strdup' in line:
                  hits.append(i)
          print('total_hits', len(hits))
          for n,i in enumerate(hits[:80],1):
              lo=max(0,i-45); hi=min(len(lines),i+70)
              print(f'\n===== HIT {n} line={i+1} =====')
              for j in range(lo,hi):
                  print(f'{j+1:06d}: {lines[j]}')
          PY

      - name: Print broad window around CMS recipient construction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          lines=(Path(os.environ['RUNNER_TEMP'])/'security.dis').read_text(errors='replace').splitlines()
          anchors=[i for i,l in enumerate(lines) if 'SecSMIMEFindBulkAlgForRecipients' in l or 'SecCmsRecipientInfoCreate' in l]
          print('anchors', [x+1 for x in anchors])
          for i in anchors[:8]:
              lo=max(0,i-260); hi=min(len(lines),i+180)
              print(f'\n===== CMS WINDOW anchor={i+1} =====')
              for j in range(lo,hi):
                  print(f'{j+1:06d}: {lines[j]}')
          PY
