name: verify-apple-cms

on:
  push:
    paths:
      - .github/workflows/verify-apple-cms.yml
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Identify shipping binary
        shell: bash
        run: |
          set -euxo pipefail
          sw_vers
          strings /usr/bin/security | grep 'PROGRAM:security' || true
          shasum -a 256 /usr/bin/security

      - name: Create temporary S-MIME recipient
        shell: bash
        run: |
          set -euxo pipefail
          KEYCHAIN="$RUNNER_TEMP/cms-test.keychain-db"
          PASS=testpass
          EMAIL=test@example.com
          security create-keychain -p "$PASS" "$KEYCHAIN"
          security unlock-keychain -p "$PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          openssl req -x509 -newkey rsa:2048 -keyout "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/cert.pem" -days 1 -nodes -subj "/CN=CMS Test/emailAddress=$EMAIL"
          # Encryption only needs the public recipient certificate. Importing the PEM directly
          # also avoids PKCS#12 compatibility differences between runner OpenSSL versions.
          security add-certificates -k "$KEYCHAIN" "$RUNNER_TEMP/cert.pem"
          security find-certificate -a -e "$EMAIL" "$KEYCHAIN"
          printf 'hello\n' > "$RUNNER_TEMP/msg.txt"

      - name: Boundary test with verbose flag before recipient list
        shell: bash
        run: |
          set +e
          EMAIL=test@example.com
          KEYCHAIN="$RUNNER_TEMP/cms-test.keychain-db"
          for N in 127 128 129; do
            R=$(python3 -c "print(','.join(['$EMAIL']*$N))")
            echo "===== -v BEFORE -r, N=$N ====="
            /usr/bin/security cms -E -v -k "$KEYCHAIN" -r "$R" -i "$RUNNER_TEMP/msg.txt" -o "$RUNNER_TEMP/out-$N.cms" >"$RUNNER_TEMP/$N.stdout" 2>"$RUNNER_TEMP/$N.stderr"
            status=$?
            bytes=$(wc -c < "$RUNNER_TEMP/out-$N.cms" 2>/dev/null || echo 0)
            echo "exit=$status bytes=$bytes"
            echo '--- stderr ---'
            cat "$RUNNER_TEMP/$N.stderr"
          done

      - name: Option-order control at 128 recipients
        shell: bash
        run: |
          set +e
          EMAIL=test@example.com
          KEYCHAIN="$RUNNER_TEMP/cms-test.keychain-db"
          R=$(python3 -c "print(','.join(['$EMAIL']*128))")

          echo '===== CONTROL A: -v BEFORE -r ====='
          /usr/bin/security cms -E -v -k "$KEYCHAIN" -r "$R" -i "$RUNNER_TEMP/msg.txt" -o "$RUNNER_TEMP/a.cms" >"$RUNNER_TEMP/a.stdout" 2>"$RUNNER_TEMP/a.stderr"
          echo "exit=$?"
          cat "$RUNNER_TEMP/a.stderr"

          echo '===== CONTROL B: -v AFTER -r ====='
          /usr/bin/security cms -E -k "$KEYCHAIN" -r "$R" -v -i "$RUNNER_TEMP/msg.txt" -o "$RUNNER_TEMP/b.cms" >"$RUNNER_TEMP/b.stdout" 2>"$RUNNER_TEMP/b.stderr"
          echo "exit=$?"
          cat "$RUNNER_TEMP/b.stderr"

          echo '===== verbose markers ====='
          printf 'before-r received-commands count: '
          grep -c 'received commands' "$RUNNER_TEMP/a.stderr" || true
          printf 'after-r received-commands count: '
          grep -c 'received commands' "$RUNNER_TEMP/b.stderr" || true
