name: verify-apple-cms

on:
  push:
    paths:
      - .github/workflows/verify-apple-cms.yml
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Identify shipping binary
        shell: bash
        run: |
          set -euxo pipefail
          sw_vers
          strings /usr/bin/security | grep 'PROGRAM:security' || true
          shasum -a 256 /usr/bin/security

      - name: Create temporary S-MIME recipient
        shell: bash
        run: |
          set -euxo pipefail
          KEYCHAIN="$RUNNER_TEMP/cms-test.keychain-db"
          PASS=testpass
          EMAIL=test@example.com
          security create-keychain -p "$PASS" "$KEYCHAIN"
          security unlock-keychain -p "$PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          openssl req -x509 -newkey rsa:2048 -keyout "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/cert.pem" -days 1 -nodes -subj "/CN=CMS Test/emailAddress=$EMAIL"
          security add-certificates -k "$KEYCHAIN" "$RUNNER_TEMP/cert.pem"
          security find-certificate -a -e "$EMAIL" "$KEYCHAIN" >/dev/null
          printf 'hello\n' > "$RUNNER_TEMP/msg.txt"

      - name: Run 127 128 129 option-order matrix
        shell: bash
        run: |
          set +e
          EMAIL=test@example.com
          KEYCHAIN="$RUNNER_TEMP/cms-test.keychain-db"
          mkdir -p "$RUNNER_TEMP/results"

          for N in 127 128 129; do
            R=$(python3 -c "print(','.join(['$EMAIL']*$N))")
            for ORDER in before after; do
              for REP in 1 2; do
                ERR="$RUNNER_TEMP/results/${N}-${ORDER}-${REP}.err"
                OUT="$RUNNER_TEMP/results/${N}-${ORDER}-${REP}.cms"
                if [ "$ORDER" = before ]; then
                  /usr/bin/security cms -E -v -k "$KEYCHAIN" -r "$R" -i "$RUNNER_TEMP/msg.txt" -o "$OUT" > /dev/null 2>"$ERR"
                else
                  /usr/bin/security cms -E -k "$KEYCHAIN" -r "$R" -v -i "$RUNNER_TEMP/msg.txt" -o "$OUT" > /dev/null 2>"$ERR"
                fi
                STATUS=$?
                MARKERS=$(grep -c 'received commands' "$ERR" 2>/dev/null || true)
                BYTES=$(wc -c < "$OUT" 2>/dev/null || echo 0)
                echo "RESULT N=$N ORDER=$ORDER REP=$REP EXIT=$STATUS VERBOSE_MARKERS=$MARKERS BYTES=$BYTES"
                sed -n '1,20p' "$ERR"
              done
            done
          done

      - name: Show recent security crash reports
        if: always()
        shell: bash
        run: |
          set +e
          echo '=== crash report files ==='
          find "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports \
            -maxdepth 1 -type f \( -iname 'security*.ips' -o -iname 'security*.crash' \) \
            -mmin -10 -print 2>/dev/null | tee "$RUNNER_TEMP/crashes.txt"
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            sed -n '1,220p' "$f"
          done < "$RUNNER_TEMP/crashes.txt"
