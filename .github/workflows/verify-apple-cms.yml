name: verify-apple-cms

on:
  push:
    paths:
      - .github/workflows/verify-apple-cms.yml
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: System version
        shell: bash
        run: |
          sw_vers
          uname -a
          which security
          shasum -a 256 /usr/bin/security

      - name: Create isolated keychain and S/MIME recipient certificate
        shell: bash
        run: |
          set -euxo pipefail
          KEYCHAIN="$RUNNER_TEMP/cms-test.keychain-db"
          PASS='cms-test-pass'
          EMAIL='cms-test@example.com'
          security create-keychain -p "$PASS" "$KEYCHAIN"
          security unlock-keychain -p "$PASS" "$KEYCHAIN"
          openssl req -x509 -newkey rsa:2048 -keyout "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/cert.pem" -days 1 -nodes -subj "/CN=CMS Test/emailAddress=$EMAIL" -addext "subjectAltName=email:$EMAIL" -addext "keyUsage=digitalSignature,keyEncipherment" -addext "extendedKeyUsage=emailProtection"
          security import "$RUNNER_TEMP/cert.pem" -k "$KEYCHAIN"
          security find-certificate -a -e "$EMAIL" "$KEYCHAIN"
          printf 'hello from cms boundary test\n' > "$RUNNER_TEMP/msg.txt"

      - name: Exercise recipient counts
        shell: bash
        run: |
          set +e
          KEYCHAIN="$RUNNER_TEMP/cms-test.keychain-db"
          EMAIL='cms-test@example.com'
          for N in 1 127 128 129 160 256 512 1024; do
            echo "===== recipient_count=$N ====="
            R=$(python3 -c "import sys; n=int(sys.argv[1]); e=sys.argv[2]; print(','.join([e]*n))" "$N" "$EMAIL")
            /usr/bin/security cms -E -k "$KEYCHAIN" -r "$R" -i "$RUNNER_TEMP/msg.txt" -o "$RUNNER_TEMP/cms-$N.der" >"$RUNNER_TEMP/cms-$N.out" 2>"$RUNNER_TEMP/cms-$N.err"
            rc=$?
            echo "exit=$rc"
            if [ -f "$RUNNER_TEMP/cms-$N.der" ]; then wc -c "$RUNNER_TEMP/cms-$N.der"; fi
            cat "$RUNNER_TEMP/cms-$N.out"
            cat "$RUNNER_TEMP/cms-$N.err"
            find "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports -maxdepth 1 -type f -iname 'security*' -mmin -5 -print 2>/dev/null || true
          done
          exit 0
