name: verify-apple-cms

on:
  push:
    paths:
      - .github/workflows/verify-apple-cms.yml
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Prepare shipping binary
        shell: bash
        run: |
          set -euxo pipefail
          sw_vers
          strings /usr/bin/security | grep 'PROGRAM:security' || true
          shasum -a 256 /usr/bin/security
          lipo /usr/bin/security -thin x86_64 -output "$RUNNER_TEMP/security.x86_64"
          xcrun llvm-objdump --macho --disassemble --no-show-raw-insn "$RUNNER_TEMP/security.x86_64" > "$RUNNER_TEMP/security.dis"

      - name: Map recipient array and following globals
        shell: bash
        run: |
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          lines=(Path(os.environ['RUNNER_TEMP'])/'security.dis').read_text(errors='replace').splitlines()
          addr_re=re.compile(r'^([0-9a-f]+):')
          rip_re=re.compile(r'^([0-9a-f]+):.*?([+-]?0x[0-9a-f]+)\(%rip\)')
          refs=[]
          for i,l in enumerate(lines):
              m=rip_re.search(l)
              if not m: continue
              nxt=None
              for j in range(i+1,min(i+5,len(lines))):
                  mm=addr_re.search(lines[j])
                  if mm:
                      nxt=int(mm.group(1),16); break
              if nxt is None: continue
              ds=m.group(2)
              disp=-int(ds[3:],16) if ds.startswith('-0x') else int(ds,16)
              target=nxt+disp
              if 0x100039800 <= target <= 0x10003a000:
                  refs.append((target,i,l))

          base=0x100039830
          end=base+128*8
          print(f'PTRARRAY_BASE=0x{base:x}')
          print(f'PTRARRAY_LAST_SLOT=0x{base+127*8:x}')
          print(f'PTRARRAY_ONE_PAST=0x{end:x}')
          print('\n=== referenced targets from base onward ===')
          for t in sorted(set(t for t,_,_ in refs if t>=base)):
              print(f'0x{t:x} delta={t-base} (0x{t-base:x})')

          for target in sorted(set(t for t,_,_ in refs if t>=end))[:12]:
              print(f'\n===== XREFS TO 0x{target:x} delta={target-base} =====')
              hits=[(i,l) for t,i,l in refs if t==target]
              for n,(i,l) in enumerate(hits,1):
                  print(f'--- xref {n}: line {i+1}: {l}')
                  lo=max(0,i-55); hi=min(len(lines),i+56)
                  for j in range(lo,hi):
                      print(f'{j+1:06d}: {lines[j]}')
          PY

      - name: Dump symbol and relocation clues around boundary
        shell: bash
        run: |
          set +e
          echo '=== nm around BSS range ==='
          nm -an "$RUNNER_TEMP/security.x86_64" 2>&1 | awk '$1 >= "0000000100039800" && $1 <= "000000010003a000" {print}' || true
          echo '=== relocations ==='
          otool -rv "$RUNNER_TEMP/security.x86_64" 2>&1 | grep -Ei '39830|39c30|39c38|39c50' -C 8 || true
          echo '=== strings that may name nearby state ==='
          strings -a /usr/bin/security | grep -Ei 'cms|recipient|password|keychain|verbose|update_single|dumpstate' | head -300 || true
